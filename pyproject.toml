[project]
name = "ai-agent-evaluation-system"
version = "0.1.0"
description = "Evaluates a LangChain refund agent with DeepEval: answers, tool calls, arguments, plans and steps."
readme = "README.md"
authors = [
    { name = "DuyBao", email = "24520146@gm.uit.edu.vn" }
]
requires-python = ">=3.14"
dependencies = [
    "deepeval>=4.3.3",
    "dotenv>=0.9.9",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.3",
    "pydantic>=2.14.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
